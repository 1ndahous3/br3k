[package]
name = "br3k"
edition = "2024"

[dependencies]
br3k-python-api-macros = { path = "../tools/python-api-macros" }
rustpython-vm = { git = "https://github.com/RustPython/RustPython.git", rev = "5bccf31156996d42882485ba70f17edbc77a713e", default-features = false, features = [
    "compiler",
    "freeze-stdlib"
] }
rustpython-pylib = { git = "https://github.com/RustPython/RustPython.git", rev = "5bccf31156996d42882485ba70f17edbc77a713e", default-features = false, features = [
    "freeze-stdlib"
] }
rustpython-stdlib = { git = "https://github.com/RustPython/RustPython.git", rev = "5bccf31156996d42882485ba70f17edbc77a713e", default-features = false, features = [
    "compiler"
] }
log = "0.4"
strum = "0.28"
strum_macros = "0.28"
thiserror = "2.0"
widestring = "1.2"
windef = { path = "windef" }
windows-sys = { version = "0.61", features = [
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_Security_Authorization"
] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Environment"
] }
pdb = "0.8"
kdmp-parser = "0.8"
minidump = "0.27"
exe = "0.5"
scroll = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
base64 = "0.23"
chrono = "0.4"
scopeguard = "1.2"
serde_norway = "0.9"

[build-dependencies]
chrono = "0.4"
