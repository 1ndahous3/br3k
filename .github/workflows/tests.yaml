name: tests

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    uses: ./.github/workflows/python.yaml

  release-tests:
    needs: python
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      BR3K_VERSION: ${{ needs.python.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            execute: true
          - target: i686-pc-windows-msvc
            execute: true
          - target: aarch64-pc-windows-msvc
            execute: false

    steps:
      - name: Enable long Git paths
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Build release artifacts
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Compile ARM64 release tests (no execution on x64)
        if: ${{ !matrix.execute }}
        run: cargo test --release --workspace --target ${{ matrix.target }} --no-run

      - name: Run release unit and host/VM tests
        if: matrix.execute
        run: cargo test --release --workspace --no-fail-fast --target ${{ matrix.target }}

      - name: Upload failed-case artifacts
        if: ${{ always() && matrix.execute }}
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.target }}
          if-no-files-found: ignore
          path: target/test-runs/

  deploy-docs:
    needs: [python, release-tests]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download built documentation
        uses: actions/download-artifact@v4
        with:
          name: python-api-docs
          path: site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
